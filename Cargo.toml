[package]
name = "ssh-mgr"
version = "0.1.0"
edition = "2021"
description = "A keyboard-driven SSH manager for terminal workflows"
license = "Apache-2.0"
readme = "README.md"
keywords = ["ssh", "tmux", "tui", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
crossterm = "0.28"
dirs = "5"
dotenvy = "0.15"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[[bin]]
name = "ssh-mgr"
path = "src/main.rs"
